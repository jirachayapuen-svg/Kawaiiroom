<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashroom — online photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&family=Space+Mono:wght@400;700&family=Caveat:wght@700&family=Pacifico&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee7;--ink:#241d1a;--mut:#241d1a99;--ln:#241d1a26;--ac:#d94f6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;font-weight:300;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
header{max-width:1000px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:10px}
h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:32px;margin:0;letter-spacing:-.5px}
header span{font:400 11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.wrap{max-width:1000px;margin:auto;display:grid;gap:8px 32px}
@media(min-width:820px){.wrap{grid-template-columns:1fr 1fr;align-items:start}}
section{margin-bottom:28px}
h2{font:400 12px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px}
h2 b{color:var(--ac);margin-right:8px}
button,.chip{font:400 13px 'Prompt',sans-serif;background:none;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.on{background:var(--ink);color:var(--bg)}
.big{background:var(--ac);border-color:var(--ac);color:#fff;padding:11px 26px;font-weight:600;font-size:15px}
button:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.lbl{width:100%;font:400 11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.fr{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 14px;scroll-snap-type:x proximity}
.tk{flex:0 0 auto;border:none;padding:0;background:none;text-align:center;border-radius:0;scroll-snap-align:start}
.tk canvas{height:170px;width:auto;display:block;box-shadow:0 3px 12px #0003;outline:2px solid transparent;outline-offset:4px}
.tk.on{background:none;color:var(--ink)}.tk.on canvas{outline-color:var(--ink)}
.tk i{display:block;font:normal 700 12px 'Space Mono',monospace;margin-top:10px}
.tk small{display:block;font-size:11px;color:var(--mut)}
.cam{position:relative;overflow:hidden;background:#000;width:100%;max-width:440px}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#tn{position:absolute;inset:0;mix-blend-mode:color;pointer-events:none}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 120px 'Playfair Display',serif;color:#fff;text-shadow:0 4px 24px #0009;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;font-size:14px}
input[type=text]{font:inherit;border:1.5px solid var(--ink);background:none;color:var(--ink);padding:8px 12px;width:100%;border-radius:0}
input[type=color]{width:34px;height:34px;border:1.5px solid var(--ink);background:none;padding:2px}
.st.k{font:400 15px 'Prompt',sans-serif;padding:5px 10px;border:1px solid var(--ln)}.st.k.on{border-color:var(--ink)}
.mach{background:#2b2522;border-radius:10px;padding:14px;max-width:440px;margin:0 auto 14px}
.plate{border:1px solid #ffffff55;color:#ffffffcc;font:400 11px 'Space Mono',monospace;text-align:center;padding:4px;margin-bottom:10px;letter-spacing:.2em}
.rol{height:14px;background:linear-gradient(#0a0a0a,#666,#0a0a0a);border-radius:4px;margin:0 5%}
.slot{background:#0c0c0c;margin:0 5%;overflow:hidden;padding:0 8%;min-height:60px}
#out{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation}
#out.hide{transform:translateY(-102%);transition:none}
#out.print{transform:translateY(0);transition:transform 5s cubic-bezier(.3,.65,.3,1)}
#note{font-size:12px;text-align:center;color:var(--mut);min-height:16px}
</style></head><body>
<header><h1>Flashroom</h1><span>online photobooth</span></header>
<div class="wrap">
<div>
 <section><h2><b>01</b>Choose frame</h2><div class="fr" id="ths"></div></section>
 <section><h2><b>02</b>Shoot</h2>
  <div class="cam" id="cam"><video id="v" playsinline muted autoplay></video><div id="tn"></div><div id="cd"></div><div id="msg">กำลังเปิดกล้อง… กด "อนุญาต" ถ้าเบราว์เซอร์ถาม</div></div>
  <div class="row"><span class="lbl">Timer</span><span id="tm" class="row" style="margin:0"></span><span class="chip" id="sm">หน้าเนียน</span></div>
  <div class="row"><button class="big" id="go">เริ่มถ่าย</button><button id="re">ถ่ายใหม่</button></div>
 </section>
</div>
<div>
 <section><h2><b>03</b>Your strip</h2>
  <div class="mach"><div class="plate">PHOTOS HERE ↓</div><div class="rol"></div><div class="slot"><canvas id="out"></canvas></div></div>
  <div class="row" style="justify-content:center"><button class="big" id="sp">เซฟรูป</button><button class="big" id="sv">เซฟวิดีโอ</button></div>
  <div id="note"></div>
 </section>
 <section><h2><b>04</b>Decorate</h2>
  <div class="row"><span class="lbl">Background</span><input type="color" id="cc" value="#ffc2d4"><button id="cr">สีเดิมของกรอบ</button></div>
  <div class="row"><span class="lbl">Caption</span><input type="text" id="tx" maxlength="28" placeholder="พิมพ์ข้อความเอง หรือเว้นว่าง"></div>
  <div class="row"><span class="lbl">Stickers · แตะเลือก แล้วแตะบนรูปเพื่อวาง</span><span id="stk" class="row" style="margin:0"></span></div>
  <div class="row"><input type="text" id="ct" maxlength="24" placeholder="พิมพ์หรือวางสติกเกอร์เอง เช่น ᵒ̴̶̷̥́ㅂᵒ̴̶̷̣̥̀" style="flex:1"><input type="color" id="sc" value="#d94f6e"></div>
  <div class="row"><input type="range" id="ss" min="4" max="14" value="7" style="flex:1"><button id="undo">ลบล่าสุด</button><button id="clr">ล้างทั้งหมด</button></div>
 </section>
</div></div>
<script>
const $=id=>document.getElementById(id);
const T=[
{n:'Cherry Milk',sub:'dreamy pastel',c:1,r:4,ra:4/3,bg:['#ffd9e4','#ffc2d4'],ink:'#c23b62',foot:'cherry milk',ff:'400 46px Pacifico',art:'cherry',cd:10,pad:40,gap:34,fil:'brightness(1.12) contrast(.88) saturate(.9)',tint:[['#ffb3c6',.28]],fx:{b:.35,g:.05,fade:'#ffe4ec'}},
{n:'Rosé Archive',sub:'soft film',c:1,r:3,ra:.8,shape:'arch',bg:['#f4d3d6','#e9b9c1'],ink:'#7c3346',foot:'rosé archive',ff:'italic 600 44px "Playfair Display"',art:'rose',pad:40,gap:26,fil:'sepia(.25) saturate(.85) contrast(.95) brightness(1.06)',tint:[['#e8a0b4',.22]],fx:{fade:'#f5d9d2',l:'#ffc9a0',g:.09,v:.22}},
{n:'Mint Noir',sub:'duotone grain',c:2,r:2,ra:1,rad:6,bg:['#d4f3ec','#a9e4d8'],dots:['+','rgba(20,110,100,.35)'],ink:'#0f6b5f',foot:'MINT NOIR  vol.01',ff:'700 30px "Space Mono"',art:'mint',pad:36,gap:14,fil:'grayscale(1) contrast(1.25) brightness(1.05)',tint:[['#35c0ad',.7]],fx:{g:.16,v:.3}},
{n:'Silver Muse',sub:'b&w film strip',c:1,r:4,ra:4/3,bg:['#1c1c1e','#2a2a2d'],ink:'#e9e9ee',foot:'silver muse',ff:'400 46px "DM Serif Display"',art:'silver',pad:46,gap:16,rad:4,fil:'grayscale(1) contrast(1.35) brightness(.98)',tint:[[]],fx:{g:.22,v:.4,b:.15}},
{n:'Prism Strip',sub:'tri-tone',c:1,r:4,ra:4/3,bg:['#ffffff','#f4f1ee'],ink:'#55504c',foot:'PRISM STRIP',ff:'700 30px "Space Mono"',art:'prism',pad:46,gap:16,rad:4,fil:'grayscale(1) contrast(1.2) brightness(1.05)',tint:[['#9b86d6',.62],[],['#3fbfae',.62],['#e0709f',.62]],fx:{g:.1,v:.15}},
{n:'Flash Kid',sub:'ccd digicam',c:2,r:2,ra:1,bg:['#ffffff','#fff0f5'],dots:['♥','rgba(255,110,160,.3)'],ink:'#e0457f',foot:'flash kid',ff:'700 54px Caveat',art:'flash',cd:9,pad:36,gap:30,fil:'brightness(1.18) contrast(1.28) saturate(1.35)',tint:[['#8fd8ff',.1]],fx:{fl:1,st:1,g:.05}},
{n:'Crimson Heart',sub:'70s red',c:1,r:1,ra:1,shape:'heart',bg:['#b01a2e','#6f0d1c'],ink:'#ffe6e6',foot:'crimson heart',ff:'400 46px Pacifico',art:'heart',pad:44,gap:0,fil:'sepia(.55) contrast(1.15) saturate(1.1) brightness(1.02)',tint:[['#c23a4a',.18]],fx:{g:.14,v:.4}},
{n:'Picnic Club',sub:'warm kodak-ish',c:2,r:2,ra:1,rad:16,bg:['#fff1f3','#ffe0e6'],pat:'gingham',pc:'rgba(255,90,110,.22)',ink:'#c2334d',foot:'picnic club',ff:'700 54px Caveat',art:'picnic',cd:10,pad:36,gap:30,fil:'saturate(1.5) contrast(1.1) brightness(1.06) sepia(.18)',tint:[['#ffcf5a',.12]],fx:{b:.28,g:.07,l:'#ffb060'}},
{n:'Y2K Chrome',sub:'cool ccd',c:1,r:3,ra:1,rad:18,bg:['#eef2fa','#b8c6e0','#eef2fa'],ink:'#3a4d7a',foot:'Y2K CHROME',ff:'700 30px "Space Mono"',art:'chrome',pad:40,gap:22,fil:'saturate(1.15) contrast(1.15) brightness(1.1) hue-rotate(-12deg)',tint:[['#6aa8ff',.16]],fx:{fl:1,v:.12,g:.05,st:1}}
];
const STK=['(˶ᵔ ᵕ ᵔ˶)','૮₍˶• ༝ •˶₎ა','ᐢ._.ᐢ','(๑>ᴗ<๑)','˙ᗜ˙','´ᯅ`','•᷄ᯅ•᷅','>ᴗoಣ','⦮._.⦯','ᐢ_ ̫ _ᐢ','ඡ·̯ඡ','·ᜊ·','♡','✧','⋆.˚','୨୧','₊˚⊹♡','ᵔᴗᵔ','☆','zZz','♪'];
let S={t:0,tm:3,smooth:false,col:null,st:STK[0],shots:[],stickers:[],busy:false,idx:0};
const th=()=>T[S.t],v=$('v'),out=$('out');
let NZ=null;
function noise(g){if(!NZ){const n=document.createElement('canvas');n.width=n.height=128;const q=n.getContext('2d'),d=q.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const k=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=k;d.data[i+3]=255}q.putImageData(d,0,0);NZ=g.createPattern(n,'repeat')}return NZ}
function cover(g,s,sw,sh,x,y,w,h){const r=w/h,q=sw/sh;let cw,ch,cx,cy;if(q>r){ch=sh;cw=sh*r;cx=(sw-cw)/2;cy=0}else{cw=sw;ch=sw/r;cx=0;cy=(sh-ch)/2}g.drawImage(s,cx,cy,cw,ch,x,y,w,h)}
function rrf(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);g.fill()}
function shape(g,x,y,w,h,k,rad){g.beginPath();
 if(k==='heart'){g.moveTo(x+w/2,y+h*.95);g.bezierCurveTo(x-w*.12,y+h*.55,x+w*.02,y-h*.02,x+w/2,y+h*.28);g.bezierCurveTo(x+w*.98,y-h*.02,x+w*1.12,y+h*.55,x+w/2,y+h*.95);g.closePath()}
 else if(k==='arch'){g.moveTo(x,y+h);g.lineTo(x,y+w/2);g.arc(x+w/2,y+w/2,w/2,Math.PI,0);g.lineTo(x+w,y+h);g.closePath()}
 else if(g.roundRect)g.roundRect(x,y,w,h,rad||10);else g.rect(x,y,w,h)}
function spark(g,x,y,r,f,s){g.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4-Math.PI/2,d=k%2?r*.3:r;g.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d)}g.closePath();g.fillStyle=f;g.fill();if(s){g.lineWidth=2;g.lineJoin='round';g.strokeStyle=s;g.stroke()}}
function heart(g,x,y,s,f,st){shape(g,x-s/2,y-s/2,s,s,'heart');if(f){g.fillStyle=f;g.fill()}if(st){g.lineWidth=3;g.strokeStyle=st;g.stroke()}}
function leaf(g,x,y,r,a){g.fillStyle='#8fb79f';g.beginPath();g.ellipse(x,y,r*.55,r*.25,a,0,7);g.fill()}
function rose(g,x,y,r){leaf(g,x+r*.9,y-r*.5,r,-.6);leaf(g,x-r*.9,y+r*.6,r,-.6);g.fillStyle='#f6a4c0';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#c74d76';g.lineWidth=Math.max(2,r/9);for(let k=1;k<4;k++){g.beginPath();g.arc(x+(k%2?1:-1)*r/10,y,r*(1-k*.25),k,k+4.4);g.stroke()}}
function fruit(g,x,y,r){g.fillStyle='#e23b4e';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#2f7a4a';g.lineWidth=4;g.beginPath();g.moveTo(x,y-r);g.quadraticCurveTo(x+r*.3,y-r*1.6,x+r*.9,y-r*1.5);g.stroke();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.arc(x-r*.35,y-r*.3,r*.18,0,7);g.fill()}
function cstar(g,x,y,r){const q=g.createLinearGradient(x-r,y-r,x+r,y+r);q.addColorStop(0,'#fff');q.addColorStop(.5,'#9fb2d6');q.addColorStop(1,'#eef2fa');spark(g,x,y,r,q,'#5a6f9c')}
function patt(g,o,W,H){
 if(o.pat==='gingham'){g.fillStyle=o.pc;for(let x=0;x<W;x+=60)g.fillRect(x,0,30,H);for(let y=0;y<H;y+=60)g.fillRect(0,y,W,30)}
 if(o.dots){g.fillStyle=o.dots[1];g.font='18px sans-serif';g.textAlign='center';g.textBaseline='middle';for(let y=16;y<H;y+=40)for(let x=(y/40%2?36:16);x<W;x+=40)g.fillText(o.dots[0],x,y)}
 if(o.art==='silver'){g.fillStyle='#f2f2f5';for(let y=18;y<H-110;y+=44){rrf(g,14,y,14,22,4);rrf(g,W-28,y,14,22,4)}}
}
function fx(g,o,x,y,w,h,s){const f=o.fx||{};
 if(f.b&&s){g.filter='blur(12px) brightness(1.25)';g.globalCompositeOperation='screen';g.globalAlpha=f.b;cover(g,s,s.width,s.height,x,y,w,h);g.filter='none';g.globalCompositeOperation='source-over';g.globalAlpha=1}
 if(f.fade){g.globalCompositeOperation='screen';g.globalAlpha=.2;g.fillStyle=f.fade;g.fillRect(x,y,w,h);g.globalCompositeOperation='source-over';g.globalAlpha=1}
 if(f.l){const q=g.createLinearGradient(x,y,x+w*.6,y+h*.5);q.addColorStop(0,f.l);q.addColorStop(1,'rgba(255,255,255,0)');g.globalCompositeOperation='screen';g.globalAlpha=.45;g.fillStyle=q;g.fillRect(x,y,w,h);g.globalCompositeOperation='source-over';g.globalAlpha=1}
 if(f.fl){const q=g.createRadialGradient(x+w/2,y+h*.4,0,x+w/2,y+h*.4,w*.7);q.addColorStop(0,'rgba(255,255,255,.45)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(x,y,w,h)}
 if(f.v){const q=g.createRadialGradient(x+w/2,y+h/2,Math.min(w,h)*.35,x+w/2,y+h/2,Math.max(w,h)*.75);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,`rgba(0,0,0,${f.v*1.8})`);g.fillStyle=q;g.fillRect(x,y,w,h)}
 if(f.g){g.globalCompositeOperation='overlay';g.globalAlpha=f.g*3;g.fillStyle=noise(g);g.fillRect(x,y,w,h);g.globalCompositeOperation='source-over';g.globalAlpha=1}
 if(f.st){g.font='700 22px "Space Mono",monospace';g.textAlign='right';g.textBaseline='alphabetic';g.fillStyle='#ff9a2b';g.shadowColor='#ff6a00';g.shadowBlur=6;const d=new Date();g.fillText(`'${String(d.getFullYear()).slice(2)} ${d.getMonth()+1} ${d.getDate()}`,x+w-16,y+h-16);g.shadowBlur=0}
}
function dv(g,o,i,x,y,w,h,n){
 const a=i%2;
 switch(o.art){
 case 'cherry':g.save();g.translate(x+w/2,y-8);g.rotate(a?.07:-.06);g.fillStyle='rgba(255,208,110,.85)';g.fillRect(-36,-12,72,24);g.restore();spark(g,x+w-2,y+h-2,17,'#fff','#ff7aa2');heart(g,x+16,y+h-16,18,'#ff7aa2');break;
 case 'rose':shape(g,x+8,y+8,w-16,h-16,'arch');g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.85)';g.stroke();rose(g,x+10,y+h-8,24);rose(g,x+w-12,y+h-6,16);break;
 case 'mint':g.fillStyle='rgba(255,255,255,.88)';rrf(g,x+10,y+10,48,24,12);g.fillStyle=o.ink;g.font='700 14px "Space Mono",monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('0'+(i+1),x+34,y+22);break;
 case 'silver':g.font='400 13px "Space Mono",monospace';g.fillStyle='rgba(255,255,255,.75)';g.textAlign='left';g.textBaseline='middle';g.fillText((i+1)+'A ▸',x+12,y+18);break;
 case 'prism':g.save();g.translate(x-24,y+h/2);g.rotate(-Math.PI/2);g.font='400 13px "Space Mono",monospace';g.fillStyle=o.ink;g.textAlign='center';g.textBaseline='middle';g.fillText('0'+(i+1)+' / 0'+n,0,0);g.restore();break;
 case 'flash':spark(g,a?x+8:x+w-6,y+6,19,'#ffe066','#e0457f');heart(g,a?x+w-4:x+6,y+h-2,24,null,'#e0457f');break;
 case 'heart':heart(g,x+w*.04,y+h*.2,30,'#fff');heart(g,x+w*.96,y+h*.62,22,'#fff');spark(g,x+w*.88,y+h*.08,20,'#ffe6e6');spark(g,x+w*.1,y+h*.8,14,'#ffe6e6');break;
 case 'picnic':fruit(g,a?x+w-6:x+6,y+6,22);fruit(g,a?x+w-38:x+38,y+16,15);break;
 case 'chrome':shape(g,x,y,w,h,'',o.rad);g.lineWidth=7;g.strokeStyle='rgba(255,255,255,.95)';g.stroke();shape(g,x+4,y+4,w-8,h-8,'',o.rad);g.lineWidth=2;g.strokeStyle='rgba(70,90,140,.45)';g.stroke();cstar(g,a?x+8:x+w-8,y+8,24);break;
 }
}
function draw(c,ti=S.t,tb=0){
 const o=T[ti],cw=420,ch=Math.round(cw/o.ra),pad=o.pad||36,gap=o.gap==null?18:o.gap,cd=o.cd||0,ft=110,ow=cw+2*cd,oh=ch+2*cd,N=o.c*o.r;
 const W=pad*2+o.c*ow+(o.c-1)*gap,H=pad*2+o.r*oh+(o.r-1)*gap+ft;
 c.width=W;c.height=H;const g=c.getContext('2d');
 if(!tb&&S.col)g.fillStyle=S.col;else{const q=g.createLinearGradient(0,0,W*.6,H);o.bg.forEach((k,j)=>q.addColorStop(j/(o.bg.length-1||1),k));g.fillStyle=q}
 g.fillRect(0,0,W,H);patt(g,o,W,H);
 for(let i=0;i<N;i++){
  const x=pad+cd+(i%o.c)*(ow+gap),y=pad+cd+Math.floor(i/o.c)*(oh+gap);
  if(cd){g.save();g.shadowColor='rgba(0,0,0,.2)';g.shadowBlur=12;g.shadowOffsetY=4;g.fillStyle='#fff';shape(g,x-cd,y-cd,ow,oh,'',(o.rad||10)+4);g.fill();g.restore()}
  g.save();shape(g,x,y,cw,ch,o.shape,o.rad);g.clip();
  g.fillStyle='rgba(255,255,255,.55)';g.fillRect(x,y,cw,ch);
  const s=tb?0:S.shots[i];
  if(s||tb){
   if(s){g.filter=o.fil;cover(g,s,s.width,s.height,x,y,cw,ch);
    if(S.smooth){g.globalAlpha=.5;g.filter='blur(4px) brightness(1.08)';cover(g,s,s.width,s.height,x,y,cw,ch);g.globalAlpha=1}
    g.filter='none'}
   else{g.fillStyle='#ecd9d2';g.fillRect(x,y,cw,ch);g.fillStyle='#8a6f72';g.beginPath();g.arc(x+cw/2,y+ch*.42,cw*.14,0,7);g.fill();g.beginPath();g.ellipse(x+cw/2,y+ch*1.02,cw*.32,ch*.3,0,0,7);g.fill()}
   const t=o.tint[i%o.tint.length];
   if(t[0]){g.globalCompositeOperation='color';g.globalAlpha=t[1];g.fillStyle=t[0];g.fillRect(x,y,cw,ch);g.globalCompositeOperation='source-over';g.globalAlpha=1}
   fx(g,o,x,y,cw,ch,s);
  }else{g.font='40px "Space Mono",monospace';g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(0,0,0,.22)';g.fillText(i+1,x+cw/2,y+ch/2)}
  g.restore();
  dv(g,o,i,x,y,cw,ch,N);
 }
 g.fillStyle=o.ink;g.textAlign='center';g.textBaseline='middle';g.font=o.ff;
 if('letterSpacing' in g)g.letterSpacing=/Mono/.test(o.ff)?'3px':'0px';
 g.fillText((tb?'':$('tx').value)||o.foot,W/2,H-ft/2-8);
 if('letterSpacing' in g)g.letterSpacing='0px';
 g.font='400 15px "Space Mono",monospace';g.globalAlpha=.65;g.fillText(new Date().toLocaleDateString('en-GB').replace(/\//g,'.'),W/2,H-ft/2+30);g.globalAlpha=1;
 if(!tb)S.stickers.forEach(s=>{const z=s.s*W/100;g.font=`600 ${z}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=z/4;g.strokeStyle='#fff';g.strokeText(s.e,s.x*W,s.y*H);g.fillStyle=s.c;g.fillText(s.e,s.x*W,s.y*H)});
}
function frames(){const box=$('ths');box.innerHTML='';
 T.forEach((o,i)=>{const b=document.createElement('button');b.className='tk'+(i==S.t?' on':'');const cv=document.createElement('canvas');draw(cv,i,1);b.append(cv);b.insertAdjacentHTML('beforeend',`<i>${o.n}</i><small>${o.sub}</small>`);
  b.onclick=()=>{if(S.busy)return;S.t=i;S.shots=[];S.stickers=[];[...box.children].forEach((k,j)=>k.classList.toggle('on',j==i));apply()};box.appendChild(b)})}
function ui(){
 $('tm').innerHTML='';[3,5,0].forEach(k=>{const b=document.createElement('span');b.className='chip'+(S.tm==k?' on':'');b.textContent=k?k+' วิ':'ทันที';b.onclick=()=>{S.tm=k;ui()};$('tm').appendChild(b)});
 $('stk').innerHTML='';STK.forEach(e=>{const b=document.createElement('button');b.className='st k'+(S.st==e&&!$('ct').value?' on':'');b.textContent=e;b.onclick=()=>{S.st=e;$('ct').value='';ui()};$('stk').appendChild(b)});
 $('sm').className='chip'+(S.smooth?' on':'');
}
function setTint(i){const a=th().tint,t=a[i%a.length];$('tn').style.background=t[0]||'transparent';$('tn').style.opacity=t[1]||0}
function apply(){$('cam').style.aspectRatio=th().ra;v.style.filter=th().fil;setTint(0);out.className='';draw(out)}
out.addEventListener('click',e=>{if(S.busy)return;const r=out.getBoundingClientRect();S.stickers.push({c:$('sc').value,e:$('ct').value||S.st,x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,s:+$('ss').value});draw(out)});
$('undo').onclick=()=>{S.stickers.pop();draw(out)};$('clr').onclick=()=>{S.stickers=[];draw(out)};
$('cc').oninput=e=>{S.col=e.target.value;draw(out)};$('cr').onclick=()=>{S.col=null;draw(out)};
$('tx').oninput=()=>draw(out);
$('sm').onclick=()=>{S.smooth=!S.smooth;ui();draw(out)};
$('re').onclick=()=>{if(S.busy)return;S.shots=[];out.className='';draw(out);$('note').textContent=''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let rec=null,chunks=[],videoBlob=null,videoExt='webm';
function startRec(){
 videoBlob=null;
 try{
  const rc=document.createElement('canvas');rc.width=720;rc.height=Math.round(720/th().ra);const g=rc.getContext('2d');
  const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mt)return;
  videoExt=mt.includes('mp4')?'mp4':'webm';chunks=[];
  rec=new MediaRecorder(rc.captureStream(30),{mimeType:mt});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{videoBlob=new Blob(chunks,{type:mt.split(';')[0]});rec=null};
  rec.start();
  (function loop(){if(!rec)return;const o=th(),t=o.tint[S.idx%o.tint.length];
   g.save();g.translate(rc.width,0);g.scale(-1,1);g.filter=o.fil;cover(g,v,v.videoWidth,v.videoHeight,0,0,rc.width,rc.height);g.restore();
   if(t[0]){g.globalCompositeOperation='color';g.globalAlpha=t[1];g.fillStyle=t[0];g.fillRect(0,0,rc.width,rc.height);g.globalCompositeOperation='source-over';g.globalAlpha=1}
   requestAnimationFrame(loop)})();
 }catch(e){rec=null}
}
$('go').onclick=async()=>{
 if(S.busy||!v.videoWidth)return;S.busy=true;$('go').disabled=true;$('note').textContent='';
 const o=th(),N=o.c*o.r;S.shots=[];out.className='hide';draw(out);startRec();
 for(let i=0;i<N;i++){
  S.idx=i;setTint(i);
  for(let t=S.tm;t>0;t--){$('cd').textContent=t;await sleep(1000)}
  $('cd').textContent='';$('cam').style.opacity=.3;await sleep(90);$('cam').style.opacity=1;
  const sn=document.createElement('canvas');sn.width=v.videoWidth;sn.height=v.videoHeight;const g=sn.getContext('2d');g.translate(sn.width,0);g.scale(-1,1);g.drawImage(v,0,0);
  S.shots.push(sn);await sleep(S.tm?600:400);
 }
 if(rec&&rec.state!=='inactive')rec.stop();
 draw(out);void out.offsetWidth;out.className='print';
 $('note').textContent='กำลังปริ้นรูป… เสร็จแล้วแตะบนรูปเพื่อวางสติกเกอร์ได้';
 setTint(0);S.busy=false;$('go').disabled=false;
};
async function save(name,data){
 try{
  const f=new File([data],name,{type:data.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[f]});$('note').textContent='เลือก "บันทึกรูปภาพ/วิดีโอ" ในเมนูที่เด้งขึ้นมา';return}
  const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);$('note').textContent='บันทึกแล้ว';
 }catch(e){if(!e||e.name!=='AbortError')$('note').textContent='เซฟไม่สำเร็จ ลองกดค้างที่รูปเพื่อบันทึก'}
}
$('sp').onclick=()=>{if(!S.shots.length){$('note').textContent='ถ่ายรูปก่อนน้า';return}out.toBlob(b=>save('flashroom-'+Date.now()+'.png',b),'image/png')};
$('sv').onclick=()=>{if(!videoBlob){$('note').textContent=S.shots.length?'วิดีโอยังไม่พร้อม หรือเบราว์เซอร์ไม่รองรับการอัด':'ถ่ายรูปก่อนน้า';return}save('flashroom-'+Date.now()+'.'+videoExt,videoBlob)};
navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false}).then(s=>{v.srcObject=s;$('msg').remove()}).catch(()=>{$('msg').textContent='เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องแล้วรีเฟรชหน้า'}):($('msg').textContent='เบราว์เซอร์นี้ไม่รองรับกล้อง');
ui();frames();apply();
Promise.all(['400 40px Pacifico','italic 600 40px "Playfair Display"','700 40px "Space Mono"','700 40px Caveat','400 40px "DM Serif Display"'].map(f=>document.fonts.load(f))).then(()=>{frames();draw(out)}).catch(()=>{});
</script></body></html>
